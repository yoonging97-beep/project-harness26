# 서비스 정책 상수 SSOT (R4). leaf = { value, status, origin }
#   origin: prd = Docs/prd.md, svc = Docs/story-service.md, user = 사용자 결정, claude-default = Claude 임의값 (🟠)
# 실행 중에는 수정하지 않는다 (R8-7).

imminent_days: { value: 3, status: confirmed, origin: prd }   # 정책 1: 3일 이내 = 임박

item_states:
  value: [보관 중, 임박, 경과, 소비 완료, 폐기]
  status: confirmed
  origin: prd

# 어기면 안 되는 것 (story-service.md). 정책은 confirmed, 탐지 패턴은 provisional.
# 탐지 결과는 후보일 뿐이다. 문맥 판정(llm-judge) 없이 BLOCK하지 않는다 (R5-6).
rules:
  C-1:
    rule: { value: "식품의 섭취 안전 여부·변질을 서비스가 판정하지 않는다.", status: confirmed, origin: svc }
    detection:
      phrases:
        value: ["먹어도 됩니다", "먹어도 돼요", "먹으면 안", "안전합니다", "안전해요", "상했", "변질되었", "변질됐", "/100", "Good", "Bad", "Poor"]
        status: provisional
        origin: claude-default
  C-2:
    rule: { value: "외부 쇼핑몰 주문과 결제를 자동으로 실행하지 않는다.", status: confirmed, origin: svc }
    detection:
      phrases:
        value: ["주문하기", "결제하기", "바로 구매", "장바구니", "자동 주문", "자동 결제"]
        status: provisional
        origin: claude-default
    exceptions:
      value: ["정기 구매"]          # PRD 2.2 생활 관리 일정
      status: confirmed
      origin: prd
  C-3:
    rule: { value: "공유 냉장고 기능은 범위에서 제외한다.", status: confirmed, origin: user }
    detection:
      phrases:
        value: ["공유 냉장고", "구성원 초대", "멤버 초대", "초대하기"]
        status: provisional
        origin: claude-default

# C-2b: 허용 목록 밖 외부 도메인 호출 금지. 초기 목록은 비어 있다 (R8 F4: 폰트 self-host).
allowed_domains: { value: [], status: provisional, origin: claude-default }
# 네트워크 호출이 아닌 식별자 URL (SVG xmlns 등). C-2b 검사에서 제외한다.
namespace_domains: { value: [www.w3.org], status: provisional, origin: claude-default }

# G2-3: 기능 ID → PRD "만들 화면" 매핑
feature_screens:
  value:
    "1.1": [식재료 등록]
    "1.2": [재고 목록, 식재료 상세]
    "1.3": [식재료 등록, 식재료 상세]
    "2.1": [홈 대시보드]
    "2.2": []
    "3.1": [냉장고 레이아웃]
    "4.1": []
    "4.2": []
  status: provisional
  origin: claude-default

# G2-15: 보관 방법·영양소 화면 참고 안내 (PRD 1.3·리스크의 의미를 옮긴 문구)
disclaimer:
  value: "참고용 안내입니다. 실제 제품 표시와 상태를 우선 확인하세요."
  status: provisional
  origin: claude-default

# R6-7 / R8 F8: 어떤 기술 결정이 필요한가. 실제 선택값은 rev-N/s1/answers.md 의 decision 에 기록한다.
required_technical_decisions:
  value:
    - id: ocr
      applies_to: ["1.1"]
  status: confirmed
  origin: user
